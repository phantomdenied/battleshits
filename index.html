<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battleshits</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  body { overflow: auto; }
  .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 12vh 16px 40px; text-align: center; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-family: var(--font-display); font-size: clamp(44px, 12vw, 84px); margin: 0; line-height: 1; }
  p { color: var(--dim); margin: 0; }
  .btn { display: block; text-decoration: none; font-size: 24px; padding: 16px; }
  .ver { position: static; margin-top: 30px; }
</style>
</head>
<body data-bg="ocean">
<div class="bg-layer"><span class="sonar"></span></div>
<div class="wrap">
  <h1>Battleshits</h1>
  <p>Party games for your TV: Battleshits, Connect 4, Hangman, Trivia, Scribble and Blackjack. Every phone is a controller.</p>
  <a class="btn" href="play.html">📱 Join on this phone</a>
  <a class="btn ghost" href="tv.html">📺 Host on this screen</a>
  <p class="ver" id="ver"></p>
</div>
<script type="module">
  import { VERSION } from "./platform.js";
  document.getElementById("ver").textContent = `Battleshits v${VERSION}`;
</script>
</body>
</html>
